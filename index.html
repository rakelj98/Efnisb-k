<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Efnisbók – eldhús, bað og gólf</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a designer's working sample binder – calm, practical, quick.
   IDEA: the material library drawer – swatches, tile chips and spec cards you pull out and pin to a board.
   PICTURE: every product is drawn as its own swatch (tile grid, planks, slab, appliance) until a real photo is added.
   COLOUR/TYPE: binder blue tape on cool paper grey; Space Grotesk titles, Inter body.
   LAYOUT: top search + category rail, card grid, sheet for details, bottom tab bar like the art dept binder. */
:root{color-scheme:light dark;--bg:light-dark(#eef0f6,#0d0f17);--card:light-dark(#fff,#151927);--ink:light-dark(#14172b,#e8ebf5);--mute:light-dark(#6a7088,#8d94ab);--line:light-dark(#dfe3ee,#252b3d);--tape:light-dark(#3b5bdb,#8aa4ff);--tapeink:light-dark(#fff,#0a0f2e);--ok:light-dark(#1f8a5f,#5fd6a0);--warn:light-dark(#c4571a,#ffa664);--heart:light-dark(#d6336c,#ff7aa8);--r:16px;--sh:0 1px 2px rgba(20,24,50,.05),0 8px 24px rgba(20,24,50,.07)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;padding-bottom:104px;overflow-x:clip}
h1,h2,h3{font-family:"Space Grotesk",system-ui,sans-serif;letter-spacing:-.02em;margin:0}
h1{font-size:clamp(24px,4vw,32px);line-height:1.05}h2{font-size:20px}h3{font-size:16px}
header,main{max-width:1240px;margin:0 auto;padding:0 16px}
header .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--mute);font-size:13px}
div.ph{position:absolute;inset:0}div.ph>svg,div.ph>img{position:absolute;inset:0;width:100%;height:100%}div.ph>img{object-fit:contain;background:#fff;padding:6px}
header{padding-top:22px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sub{color:var(--mute);font-size:13px}
#sync{font-size:12px;color:var(--mute);white-space:nowrap}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:40px}
button.go{background:var(--tape);color:var(--tapeink);border-color:transparent}
button.ghost{background:none;border-color:transparent;color:var(--mute)}
input,select,textarea{width:100%;background:color-mix(in srgb,var(--bg) 55%,var(--card));border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px}
textarea{min-height:90px;resize:vertical}
:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin:14px 0}
.rail{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scroll-snap-type:x proximity}
.rail button{flex:none;border-radius:999px;padding:7px 14px;min-height:36px;font-weight:500;scroll-snap-align:start}
.rail button[aria-pressed=true]{background:var(--tape);color:var(--tapeink);border-color:var(--tape)}
.rail button small{opacity:.7;margin-left:4px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar .q{flex:1 1 240px}.bar select{width:auto}
.filters{display:none;margin-top:10px;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.filters.open{display:grid}
.fg label{display:block;font-size:12px;color:var(--mute);margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:500;min-height:32px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:color-mix(in srgb,var(--tape) 18%,var(--card));border-color:var(--tape)}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:none}
.row2{display:flex;gap:8px}
.count{color:var(--mute);font-size:13px;margin:6px 2px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;position:relative}
.vis{aspect-ratio:4/3;background:var(--bg);position:relative;overflow:hidden}
.vis svg,.vis img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;left:8px;top:8px;background:color-mix(in srgb,var(--card) 88%,transparent);border-radius:999px;font-size:11px;padding:2px 8px;font-weight:600}
.rank{position:absolute;right:8px;top:8px;background:var(--tape);color:var(--tapeink);border-radius:999px;font:700 12px "Space Grotesk",system-ui,sans-serif;padding:2px 8px}
.body{padding:10px 12px 4px;flex:1}
.nm{font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.co{color:var(--mute);font-size:13px;margin-top:2px}
.pr{font:700 17px "Space Grotesk",system-ui,sans-serif;margin-top:6px;white-space:nowrap}
.pr small{font:500 12px Inter,system-ui,sans-serif;color:var(--mute)}
.pr.none{font:500 13px Inter,system-ui,sans-serif;color:var(--mute)}
.zz{font-size:12px;color:var(--mute);margin-top:2px}
.foot{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 6px 8px}
.stars{display:flex}
.stars button{border:0;background:none;padding:4px 2px;min-height:32px;font-size:18px;line-height:1;color:var(--line);font-weight:400}
.stars button.on{color:#e0a800}
.heart{border:0;background:none;font-size:20px;color:var(--mute);padding:4px 8px;min-height:36px}
.heart.on{color:var(--heart)}
.ni{font-size:12px;color:var(--mute)}
.empty{color:var(--mute);text-align:center;padding:40px 10px}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:620px;margin:0 auto;display:flex;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 30px rgba(20,24,50,.18);z-index:20;padding:4px}
nav button{flex:1;border:0;border-radius:16px;background:none;color:var(--mute);font-size:13px;padding:10px 2px;min-height:48px}
nav button[aria-selected=true]{background:color-mix(in srgb,var(--tape) 14%,var(--card));color:var(--tape)}
.sheet{position:fixed;inset:0;background:rgba(10,12,25,.45);display:none;z-index:30;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .in{background:var(--card);width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px 28px}
@media(min-width:800px){.sheet{align-items:center}.sheet .in{border-radius:22px}}
.shead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}
.big{aspect-ratio:16/9;border-radius:14px;overflow:hidden;position:relative;background:var(--bg)}
.big svg,.big img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.kv{display:grid;grid-template-columns:8em 1fr;gap:4px 12px;font-size:14px;margin:12px 0}
.kv dt{color:var(--mute)}.kv dd{margin:0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.thumbs figure{margin:0;position:relative;width:96px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button{position:absolute;right:2px;top:2px;min-height:0;padding:0 6px;border-radius:8px;font-size:12px}
.lnk{color:var(--tape);font-weight:600;text-decoration:none}
.sec{margin-top:16px}.sec>label{font-size:12px;color:var(--mute);display:block;margin-bottom:6px}
.boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.bcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;cursor:pointer}
.mini{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr 1fr;height:150px;gap:2px;background:var(--line)}
.mini div{position:relative;overflow:hidden;background:var(--bg)}.mini div:first-child{grid-row:span 2}
.mini svg,.mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slots{display:grid;align-items:start;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px}
.slot{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.slot h3{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sitems{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.si{border-radius:12px;overflow:hidden;border:1px solid var(--line);position:relative;background:var(--bg)}
.si .v{aspect-ratio:1;position:relative}.si .v svg,.si .v img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.si .t{font-size:12px;padding:5px 7px;background:var(--card);line-height:1.25}
.si .x{position:absolute;right:4px;top:4px;min-height:0;padding:1px 7px;border-radius:8px;font-size:13px}
.collage{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:90px;gap:4px;border-radius:var(--r);overflow:hidden;margin:12px 0}
.collage div{position:relative;overflow:hidden;background:var(--bg)}
.collage svg,.collage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.collage span{position:absolute;left:6px;bottom:6px;font-size:11px;background:color-mix(in srgb,var(--card) 85%,transparent);padding:1px 6px;border-radius:6px;font-weight:600}
.cotab{width:100%;border-collapse:collapse;font-size:14px}
.cotab td,.cotab th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.cotab th{font-size:12px;color:var(--mute);font-weight:600}
.grp{margin:20px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
.toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.body{padding:8px 9px 2px}.pr{font-size:15px}.stars button{font-size:15px;padding:4px 1px}.kv{grid-template-columns:6.5em 1fr}.collage{grid-auto-rows:64px}.cotab .hide{display:none}}
</style>
</head>
<body>
<header>
  <div><h1>Efnisbók</h1><div class="sub" id="meta">Eldhús, bað og gólf · Reykjavík og nágrenni</div></div>
  <div class="tools"><span id="sync">Hleður…</span><button id="bkp" class="chip">Sækja afrit</button><label class="chip" style="cursor:pointer">Setja inn afrit<input type="file" id="rst" accept="application/json,.json" hidden></label></div>
</header>
<main id="app"></main>
<nav role="tablist">
  <button role="tab" data-v="vorur">Vörur</button>
  <button role="tab" data-v="likad">Líkað</button>
  <button role="tab" data-v="moodboard">Moodboard</button>
  <button role="tab" data-v="fyrirtaeki">Fyrirtæki</button>
</nav>
<div class="sheet" id="sheet"><div class="in" id="sheetIn" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>
<script>
{
const CATS=[['allt','Allt'],['eldhus','Eldhúsinnréttingar'],['bord','Borðplötur'],['veggfl','Veggflísar'],['golffl','Gólfflísar'],['parket','Parket og gólfefni'],['ofnar','Ofnar'],['hellubord','Helluborð'],['hafar','Háfar'],['uppthv','Uppþvottavélar'],['kaeli','Kæliskápar'],['bt_vask','Blöndunartæki – vaskur'],['bt_sturta','Blöndunartæki – sturta'],['vaskar','Vaskar / handlaugar'],['klosett','Klósett og kassar'],['skolhn','Skolhnappar'],['bad','Annað á baði']];
const CATN=Object.fromEntries(CATS);CATN.flisar='Flísar';
const COLHEX={'Gyllt / messing':'#c9a45c','Hvítt':'#f2f0ea','Svart':'#2a2a30','Grátt':'#9b9ea5','Beige / sandur':'#d9c7a7','Viður / brúnt':'#a8774d','Blátt':'#5b80a9','Grænt':'#6f8f6a','Bleikt / rautt':'#c47a80','Stál / málmur':'#b9bdc3','Annað':'#c9ced8'};
const SLOTS=[['eldhus','Innrétting',['eldhus']],['bord','Borðplata',['bord']],['veggfl','Veggflísar',['flisar']],['golf','Gólf',['flisar','parket']],['taeki','Tæki',['ofnar','hellubord','hafar','uppthv','kaeli']],['bad','Baðherbergi',['bt_vask','bt_sturta','vaskar','klosett','skolhn','bad']],['annad','Annað',null]];
let D={items:[],companies:[]},CO={},S={m:{},boards:[],custom:[]};
let V={view:'vorur',cat:'allt',q:'',co:new Set(),col:new Set(),sh:new Set(),sz:new Set(),sub:new Set(),wid:new Set(),pmin:'',pmax:'',onlyP:false,onlyL:false,sort:'rank',fopen:false,board:null};

const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const safeUrl=u=>/^https:\/\//.test(u||'')?u:(/^http:\/\//.test(u||'')?u.replace('http:','https:'):'');
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1600)};
const all=()=>D.items.concat(S.custom);
const byId=id=>all().find(i=>i.id===id);
const mk=id=>S.m[id]||{};
function setMk(id,patch){const o={...mk(id),...patch};for(const k in o)if(o[k]===''||o[k]==null||o[k]===0||o[k]===false||(Array.isArray(o[k])&&!o[k].length))delete o[k];if(Object.keys(o).length)S.m[id]=o;else delete S.m[id];save('marks')}

/* ---------- drawings ---------- */
function shade(hex,a){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(v+a)));return `rgb(${f(r)},${f(g)},${f(b)})`}
function draw(it){
  let k=it.k;const c=COLHEX[it.col]||COLHEX['Annað'],d=shade(c,-28),l=shade(c,26),W=160,H=120;
  let s='';
  if(k==='flisar'||(k==='bord'&&false)){
    let w=it.w||30,h=it.h||30;if(w<h&&w*h<2000){}
    const px=Math.max(.22,Math.min(1.3,90/Math.max(w,h)));let tw=Math.max(7,w*px),th=Math.max(7,h*px);
    if(tw>W*.9){const f=W*.9/tw;tw*=f;th*=f}
    for(let y=-2,r=0;y<H;y+=th+1.5,r++)for(let x=(r%2&&th<tw/2?-tw/2:0)-2;x<W;x+=tw+1.5){const v=((x*7+y*13)|0)%3;s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${tw.toFixed(1)}" height="${th.toFixed(1)}" fill="${v?c:shade(c,it.col==='Hvítt'?-6:10)}"/>`}
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice"><rect width="${W}" height="${H}" fill="${d}"/>${s}</svg>`;
  }
  if(k==='parket'){
    if(/Síldarbein|chevron/i.test(it.s||'')){for(let y=-20;y<H+20;y+=14)for(let x=-20;x<W+20;x+=28){s+=`<path d="M${x} ${y} l14 14 l0 6 l-14 -14z" fill="${c}" stroke="${d}" stroke-width=".6"/><path d="M${x+14} ${y+14} l14 -14 l0 6 l-14 14z" fill="${l}" stroke="${d}" stroke-width=".6"/>`}}
    else if(it.s==='Teppi'){for(let y=0;y<H;y+=3)s+=`<line x1="0" y1="${y}" x2="${W}" y2="${y+2}" stroke="${y%6?l:d}" stroke-width="1.2" opacity=".5"/>`}
    else{const ph=it.s==='Vínyl'?16:14;for(let y=0,r=0;y<H;y+=ph,r++){let x=-((r*53)%90);while(x<W){const L=70+((r*31+x)|0)%50;s+=`<rect x="${x}" y="${y}" width="${L}" height="${ph-1}" fill="${(r+x)%3?c:l}"/><path d="M${x+6} ${y+ph/2} q${L/3} -3 ${L-12} 1" stroke="${d}" stroke-width=".5" fill="none" opacity=".5"/>`;x+=L+1}}}
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice"><rect width="${W}" height="${H}" fill="${d}"/>${s}</svg>`;
  }
  if(k==='bord'){
    s=`<rect width="${W}" height="${H}" fill="${c}"/>`;for(let i=0;i<5;i++){const y=10+i*24;s+=`<path d="M-10 ${y} C 40 ${y+18}, 80 ${y-14}, 170 ${y+10}" stroke="${i%2?d:l}" stroke-width="${i%2?1.2:2.4}" fill="none" opacity=".55"/>`}
    s+=`<rect x="0" y="${H-14}" width="${W}" height="14" fill="${d}" opacity=".6"/>`;return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice">${s}</svg>`;
  }
  const bg='var(--bg)',st=shade(c,-60);
  if(k==='eldhus'){s=`<rect width="${W}" height="${H}" fill="${shade(c,40)}"/><rect x="10" y="62" width="140" height="6" fill="${d}"/>`;for(let i=0;i<4;i++){s+=`<rect x="${12+i*34.5}" y="70" width="33" height="42" rx="2" fill="${c}" stroke="${d}"/><rect x="${12+i*34.5}" y="10" width="33" height="34" rx="2" fill="${c}" stroke="${d}"/><rect x="${24+i*34.5}" y="73" width="10" height="2" fill="${st}"/>`}return `<svg viewBox="0 0 ${W} ${H}">${s}</svg>`}
  const fill=it.col==='Annað'?'#dfe2ea':c;
  const BS={bt_vask:'Blönd',bt_sturta:'Sturt',vaskar:'Handlaug',klosett:'Salerni',skolhn:'Skol'};
  if(BS[k]){it={...it,s:BS[k]+' '+(it.s||'')};k='bad'}
  const ic={
    ofnar:`<rect x="45" y="18" width="70" height="84" rx="6" fill="${fill}" stroke="${st}"/><rect x="53" y="40" width="54" height="40" rx="4" fill="${shade(fill,-45)}"/><rect x="53" y="26" width="54" height="5" rx="2" fill="${st}"/>`,
    hellubord:`<rect x="22" y="38" width="116" height="52" rx="6" fill="${fill}" stroke="${st}"/><circle cx="52" cy="57" r="11" fill="none" stroke="${shade(fill,60)}" stroke-width="2"/><circle cx="108" cy="57" r="13" fill="none" stroke="${shade(fill,60)}" stroke-width="2"/><circle cx="80" cy="75" r="9" fill="none" stroke="${shade(fill,60)}" stroke-width="2"/>`,
    hafar:/Eyju|Loft/.test(it.s)?`<rect x="74" y="0" width="12" height="44" fill="${shade(fill,-20)}"/><path d="M50 44 h60 l12 34 h-84z" fill="${fill}" stroke="${st}"/>`:`<rect x="70" y="8" width="20" height="40" fill="${shade(fill,-20)}"/><path d="M40 48 h80 l10 30 h-100z" fill="${fill}" stroke="${st}"/>`,
    uppthv:`<rect x="48" y="16" width="64" height="88" rx="5" fill="${fill}" stroke="${st}"/><rect x="58" y="24" width="44" height="4" rx="2" fill="${st}"/>`,
    kaeli:`<rect x="55" y="6" width="50" height="108" rx="5" fill="${fill}" stroke="${st}"/><line x1="55" y1="66" x2="105" y2="66" stroke="${st}"/><rect x="96" y="20" width="3" height="20" fill="${st}"/><rect x="96" y="72" width="3" height="20" fill="${st}"/>`,
    bad:/salerni|Salerni|kassi/.test(it.s||'')?`<rect x="66" y="22" width="34" height="30" rx="4" fill="${fill}" stroke="${st}"/><path d="M58 56 h50 q0 26 -22 30 h-6 q-22 -4 -22 -30z" fill="${fill}" stroke="${st}"/>`:/Sturt/.test(it.s||'')?`<rect x="40" y="10" width="80" height="100" fill="${shade(fill,40)}" opacity=".5" stroke="${st}"/><path d="M98 18 v12 h-14" stroke="${st}" stroke-width="3" fill="none"/><circle cx="84" cy="34" r="7" fill="${st}"/>`:/^Skol/.test(it.s||'')?`<rect x="50" y="30" width="60" height="60" rx="6" fill="${fill}" stroke="${st}"/><rect x="58" y="38" width="20" height="44" rx="3" fill="${shade(fill,-25)}"/><rect x="82" y="38" width="20" height="44" rx="3" fill="${shade(fill,-25)}"/>`:/Blönd/.test(it.s||'')?`<path d="M70 90 v-40 q0 -14 14 -14 h22 v8 h-18 q-6 0 -6 6 v40z" fill="${fill}" stroke="${st}"/><rect x="62" y="88" width="30" height="8" rx="3" fill="${st}"/>`:`<rect x="34" y="34" width="92" height="58" rx="6" fill="${fill}" stroke="${st}"/><ellipse cx="80" cy="34" rx="34" ry="8" fill="${shade(fill,30)}" stroke="${st}"/>`
  };

}
const imgSrc=it=>{const p=(mk(it.id).ph||[])[0];if(p)return p;if(it.img&&/^(https:\/\/|img\/)/.test(it.img))return it.img;return ''};
const photo=it=>{const src=imgSrc(it);return src?`<div class="ph">${draw(it)}<img src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()"></div>`:draw(it)};

/* ---------- filtering ---------- */
function inCat(it,c){if(c==='allt')return true;if(c==='veggfl')return it.k==='flisar'&&it.wall!==false;if(c==='golffl')return it.k==='flisar'&&it.floor;return it.k===c}
function priceTxt(it){if(it.p==null)return '<div class="pr none">Verð í verslun / tilboð</div>';const pre=it.u==='frá'||it.u==='tilboð frá'?'frá ':'';return `<div class="pr">${pre}${fmt(it.p)} kr${it.u==='m²'?'<small> /m²</small>':it.u==='pakki'?'<small> /pakka</small>':''}</div>`}
function results(){
  const q=V.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let r=all().filter(it=>inCat(it,V.cat));
  if(q.length)r=r.filter(it=>{const t=[it.n,CO[it.c]?.n||it.cn,it.b,it.s,it.f,it.z,it.col,CATN[it.k],mk(it.id).n].join(' ').toLowerCase();return q.every(w=>t.includes(w))});
  const base=r;
  if(V.co.size)r=r.filter(i=>V.co.has(i.c));
  if(V.col.size)r=r.filter(i=>V.col.has(i.col));
  if(V.sh.size)r=r.filter(i=>V.sh.has(i.sh));
  if(V.sz.size)r=r.filter(i=>V.sz.has(i.sz));
  if(V.sub.size)r=r.filter(i=>V.sub.has(i.s));
  if(V.wid.size)r=r.filter(i=>V.wid.has(String(i.wid)));
  const mn=+V.pmin,mx=+V.pmax;
  if(V.pmin!=='')r=r.filter(i=>i.p!=null&&i.p>=mn);
  if(V.pmax!=='')r=r.filter(i=>i.p!=null&&i.p<=mx);
  if(V.onlyP)r=r.filter(i=>i.p!=null);
  if(V.onlyL)r=r.filter(i=>mk(i.id).l||mk(i.id).r);
  const pr=i=>i.p==null?Infinity:i.p;
  const so={rank:(a,b)=>(mk(b.id).r||0)-(mk(a.id).r||0)||(mk(b.id).l?1:0)-(mk(a.id).l?1:0)||pr(a)-pr(b),pu:(a,b)=>pr(a)-pr(b),pd:(a,b)=>(b.p??-1)-(a.p??-1),nm:(a,b)=>a.n.localeCompare(b.n,'is'),co:(a,b)=>(CO[a.c]?.n||'').localeCompare(CO[b.c]?.n||'','is')||pr(a)-pr(b)}[V.sort];
  return {r:r.sort(so),base};
}
function facet(list,key,label){const m=new Map();list.forEach(i=>{const v=i[key];if(v!=null&&v!=='')m.set(String(v),(m.get(String(v))||0)+1)});return [...m].sort((a,b)=>key==='wid'?a[0]-b[0]:b[1]-a[1])}
function chipGroup(id,label,entries,set,fn){if(entries.length<2)return '';return `<div class="fg"><label>${label}</label><div class="chips">${entries.map(([v,n])=>`<button class="chip" data-f="${id}" data-v="${esc(v)}" aria-pressed="${set.has(v)}">${fn?fn(v):''}${esc(id==='co'?(CO[v]?.n||v):id==='wid'?v+' cm':v)} <small>${n}</small></button>`).join('')}</div></div>`}

function card(it,rank){const m=mk(it.id),coN=CO[it.c]?.n||it.cn||'';return `<article class="card" data-id="${esc(it.id)}"><div class="vis">${photo(it)}<span class="tag">${esc(it.s||CATN[it.k]||'')}</span>${rank?`<span class="rank">#${rank}</span>`:''}</div><div class="body"><div class="nm">${esc(it.n)}</div><div class="co">${esc(coN)}${it.b&&!it.n.includes(it.b)?' · '+esc(it.b):''}</div>${priceTxt(it)}${it.z?`<div class="zz">${esc(it.z)}</div>`:''}</div><div class="foot">${stars(it.id,m.r)}<span>${m.n?'<span class="ni" title="Athugasemd">✎</span>':''}<button class="heart ${m.l?'on':''}" data-like="${esc(it.id)}" aria-label="Líka við" aria-pressed="${!!m.l}">${m.l?'♥':'♡'}</button></span></div></article>`}
function stars(id,r){r=r||0;return `<span class="stars" role="group" aria-label="Röðun">${[1,2,3,4,5].map(i=>`<button data-star="${esc(id)}" data-n="${i}" class="${i<=r?'on':''}" aria-label="${i} stjörnur">★</button>`).join('')}</span>`}

  ${it.custom?'<div class="sec"><button id="ced">Breyta eigin vöru</button> <button id="cdel" class="ghost">Eyða</button></div>':''}`;
  $('#cx').onclick=closeSheet;
  const nt=$('#nt');nt.oninput=()=>{clearTimeout(nt._t);nt._t=setTimeout(()=>{setMk(id,{n:nt.value});render(true)},500)};
  $('#tbgo').onclick=()=>{let bid=$('#tb').value;if(bid==='__new'){const b={id:'b'+Date.now().toString(36),name:'Moodboard '+(S.boards.length+1),slots:{},note:''};S.boards.push(b);bid=b.id}const b=S.boards.find(x=>x.id===bid);const sl=slotFor(it);const a=b.slots[sl]=b.slots[sl]||[];if(!a.includes(id))a.push(id);if(!m.l)setMk(id,{l:true});save('boards');toast('Bætt á '+b.name);detail(id)};
  const up=$('#up');up.onchange=async()=>{for(const f of [...up.files]){try{const d=await shrink(f);setMk(id,{ph:[...(mk(id).ph||[]),d]})}catch(e){toast('Tókst ekki að lesa mynd')}}detail(id);render(true)};
  $('#pgo').onclick=()=>{const u=safeUrl($('#purl').value.trim());if(!u){toast('Slóð þarf að byrja á https://');return}setMk(id,{ph:[...(mk(id).ph||[]),u]});detail(id);render(true)};
  document.querySelectorAll('[data-dph]').forEach(b=>b.onclick=()=>{const a=[...(mk(id).ph||[])];a.splice(+b.dataset.dph,1);setMk(id,{ph:a});detail(id);render(true)});
  $('#ced')&&($('#ced').onclick=()=>editCustom(it));
  $('#cdel')&&($('#cdel').onclick=()=>confirmBox('Eyða þessari vöru?',()=>{S.custom=S.custom.filter(x=>x.id!==id);save('custom');closeSheet();render()}));
  openSheet();
}
const slotFor=it=>it.k==='eldhus'?'eldhus':it.k==='bord'?'bord':it.k==='flisar'?(it.wall!==false?'veggfl':'golf'):it.k==='parket'?'golf':it.k==='bad'?'bad':['ofnar','hellubord','hafar','uppthv','kaeli'].includes(it.k)?'taeki':'annad';
function editCustom(it){
  it=it||{};const opts=CATS.slice(1).map(([k,n])=>{const kk=k==='veggfl'||k==='golffl'?'flisar':k;return `<option value="${k}" ${(it.k===kk&&(kk!=='flisar'||(k==='veggfl')===(it.wall!==false)))?'selected':''}>${n}</option>`}).join('');
  $('#sheetIn').innerHTML=`<div class="shead"><h2>${it.id?'Breyta vöru':'Bæta við eigin vöru'}</h2><button id="cx">Loka</button></div>
  <form id="cf"><div class="fg"><label>Flokkur</label><select name="k">${opts}</select></div>
  <div class="fg sec"><label>Heiti</label><input name="n" required value="${esc(it.n||'')}"></div>
  <div class="row2 sec"><div class="fg" style="flex:1"><label>Fyrirtæki</label><input name="cn" list="cl" value="${esc(it.cn||CO[it.c]?.n||'')}"><datalist id="cl">${D.companies.map(c=>`<option value="${esc(c.n)}">`).join('')}</datalist></div><div class="fg" style="flex:1"><label>Framleiðandi</label><input name="b" value="${esc(it.b||'')}"></div></div>
  <div class="row2 sec"><div class="fg" style="flex:1"><label>Verð (kr)</label><input name="p" inputmode="numeric" value="${it.p??''}"></div><div class="fg" style="flex:1"><label>Eining</label><select name="u"><option value="stk">stk</option><option value="m²" ${it.u==='m²'?'selected':''}>m²</option><option value="frá" ${it.u==='frá'?'selected':''}>frá</option></select></div></div>
  <div class="row2 sec"><div class="fg" style="flex:1"><label>Stærð (t.d. 60x120)</label><input name="z" value="${esc(it.z||'')}"></div><div class="fg" style="flex:1"><label>Litur</label><select name="col">${Object.keys(COLHEX).map(c=>`<option ${it.col===c?'selected':''}>${c}</option>`).join('')}</select></div></div>
  <div class="fg sec"><label>Tengill (https://…)</label><input name="url" value="${esc(it.url||'')}"></div>
  <div class="fg sec"><label>Lýsing</label><input name="f" value="${esc(it.f||'')}"></div>
  <p><button class="go" type="submit">Vista</button></p></form>`;
  $('#cx').onclick=closeSheet;
  $('#cf').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const k=f.k==='veggfl'||f.k==='golffl'?'flisar':f.k;const co=D.companies.find(c=>c.n.toLowerCase()===f.cn.trim().toLowerCase());
    const n={id:it.id||'cu'+Date.now().toString(36),custom:true,k,n:f.n.trim(),c:co?co.id:'',cn:co?'':f.cn.trim(),b:f.b.trim(),u:f.u,z:f.z.trim(),col:f.col,url:f.url.trim(),f:f.f.trim(),s:'Eigin vara'};
    const pp=f.p.replace(/\D/g,'');if(pp)n.p=+pp;if(k==='flisar'){n.wall=f.k==='veggfl';n.floor=f.k==='golffl';const m=f.z.match(/(\d+(?:[.,]\d+)?)\s*[x×]\s*(\d+(?:[.,]\d+)?)/);if(m){n.w=+m[1].replace(',','.');n.h=+m[2].replace(',','.')}}
    S.custom=S.custom.filter(x=>x.id!==n.id);S.custom.push(n);save('custom');detail(n.id);render(true)};
  openSheet();
}
function confirmBox(t,ok){$('#sheetIn').innerHTML=`<h2>${esc(t)}</h2><p class="sub">Þetta er ekki hægt að afturkalla.</p><div class="bar"><button class="go" id="y">Já, eyða</button><button id="n">Hætta við</button></div>`;openSheet();$('#y').onclick=()=>{closeSheet();ok()};$('#n').onclick=closeSheet}
function openSheet(){$('#sheet').classList.add('open');document.body.style.overflow='hidden'}
function closeSheet(){$('#sheet').classList.remove('open');document.body.style.overflow=''}
$('#sheet').onclick=e=>{if(e.target.id==='sheet')closeSheet()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* ---------- global clicks ---------- */
document.addEventListener('click',e=>{
  const st=e.target.closest('[data-star]');if(st){e.stopPropagation();const id=st.dataset.star,n=+st.dataset.n;setMk(id,{r:mk(id).r===n?0:n});refreshItem(id);return}
  const lk=e.target.closest('[data-like]');if(lk){e.stopPropagation();const id=lk.dataset.like;setMk(id,{l:!mk(id).l});toast(mk(id).l?'Bætt í Líkað':'Fjarlægt úr Líkað');refreshItem(id);return}
  const cd=e.target.closest('.card');if(cd&&!e.target.closest('a')){detail(cd.dataset.id)}
});
function refreshItem(id){if($('#sheet').classList.contains('open')&&$('#sheetIn [data-like]')?.dataset.like===id)detail(id);render(true)}

/* ---------- routing ---------- */
function go(v){V.view=v;if(location.hash!=='#'+v)history.replaceState(null,'','#'+v);render();scrollTo(0,0)}
function render(keep){const y=scrollY;document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===V.view));({vorur:vVorur,likad:vLikad,moodboard:vMood,fyrirtaeki:vFyrirtaeki}[V.view]||vVorur)();if(keep)scrollTo(0,y)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{if(b.dataset.v==='moodboard')V.board=null;go(b.dataset.v)});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(['vorur','likad','moodboard','fyrirtaeki'].includes(h)&&h!==V.view){V.view=h;render()}});

/* ---------- persistence (í vafranum + afrit) ---------- */
function lsGet(){try{const j=JSON.parse(localStorage.getItem('eb-state')||'null');if(j)return j}catch(e){}return null}
function sync(t){$('#sync').textContent=t}
function save(){try{localStorage.setItem('eb-state',JSON.stringify(S));sync('Vistað í þessum vafra')}catch(e){sync('Geymsla vafrans full – taktu afrit og fjarlægðu myndir')}}
function initStore(){const c=lsGet();if(c){S={m:c.m||{},boards:c.boards||[],custom:c.custom||[]};render(true)}sync('Vistað í þessum vafra')}
function shrink(f){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const k=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(f)})}
$('#bkp').onclick=()=>{const b=new Blob([JSON.stringify({efnisbok:1,t:new Date().toISOString(),...S})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='efnisbok-afrit-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('Afrit sótt')};
$('#rst').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!j.efnisbok)throw 0;S={m:j.m||{},boards:j.boards||[],custom:j.custom||[]};save();render();toast('Afrit sett inn')}catch(_){toast('Þetta er ekki afrit úr Efnisbók')}e.target.value=''};

/* ---------- boot ---------- */
(async()=>{
  try{const r=await fetch('data.json');D=await r.json()}catch(e){app.innerHTML='<div class="panel empty">Gat ekki hlaðið vörulista.</div>';return}
  D.companies.forEach(c=>CO[c.id]=c);
  $('#meta').textContent=`${D.items.length} vörur · ${D.companies.length} fyrirtæki · verð sótt ${D.date.split('-').reverse().join('.')}`;
  try{const c=localStorage.getItem('eb-cat');if(c&&CATN[c])V.cat=c}catch(e){}
  const h=location.hash.slice(1);if(['vorur','likad','moodboard','fyrirtaeki'].includes(h))V.view=h;
  render();initStore();
})();
}
</script>
</body>
</html>
