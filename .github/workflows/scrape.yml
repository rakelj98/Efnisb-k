name: Safna vörum af síðum seljenda

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Bara þessi fyrirtæki (t.d. egill,ht) – tómt = öll'
        required: false
        default: ''
  push:
    paths: ['scripts/scrape.py', 'scripts/targets.json']
  schedule:
    - cron: '41 3 * * 1'   # mánudaga: sækja nýjar vörur, verð og myndir

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright requests beautifulsoup4 pillow && python -m playwright install --with-deps chromium
      - run: python scripts/scrape.py
        env:
          ONLY: ${{ github.event.inputs.only }}
      - run: python scripts/gen.py
      - run: python scripts/fetch_images.py
      - name: Vista
        run: |
          git config user.name "efnisbok-bot"
          git config user.email "efnisbok-bot@users.noreply.github.com"
          git add scraped.json data.json img
          git diff --cached --quiet || git commit -m "Vörur sóttar af síðum seljenda"
          git pull --rebase && git push
