name: Sækja vörumyndir

on:
  workflow_dispatch:
  push:
    paths: ['data.json', 'scripts/**']
  schedule:
    - cron: '17 4 * * 1'   # mánudaga kl. 04:17

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pillow
      - run: python scripts/fetch_images.py
      - name: Vista myndir
        run: |
          git config user.name "efnisbok-bot"
          git config user.email "efnisbok-bot@users.noreply.github.com"
          git add img data.json
          git diff --cached --quiet || git commit -m "Nýjar vörumyndir"
          git push
